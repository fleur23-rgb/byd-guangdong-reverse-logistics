[project]
name = "byd-guangdong-reverse-logistics"
version = "0.1.0"
description = "Public-data-driven reverse logistics network model for BYD's Guangdong case"
requires-python = ">=3.11"
dependencies = [
  "highspy==1.15.1",
  "matplotlib==3.10.8",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pyomo==6.10.1",
  "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
